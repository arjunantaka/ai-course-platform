name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Jalankan ulang pemeriksaan begitu ada push baru ke PR yang sama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Check, test, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # --frozen-lockfile: CI gagal bila package.json dan bun.lock tidak sinkron.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Stage 1: tipe dan aksesibilitas (svelte-check harus 0 error / 0 warning).
      - name: Typecheck
        run: bun run check

      # Stage 2: unit test, tanpa network dan tanpa kredensial AI.
      - name: Unit test
        run: bun run test:unit

      # Stage 3: smoke e2e terhadap prod bundle. Script menyediakan seluruh env
      # sendiri (ADMIN_TOKEN, DB_PATH, PORT, ORIGIN) sehingga tidak butuh secret.
      # Tanpa AI_API_KEY, jalur generate dilewati dan sisanya tetap diverifikasi.
      - name: Smoke test
        run: bun run smoke