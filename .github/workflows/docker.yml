name: Docker

on:
  push:
    branches: [main]
    # Hanya jalankan bila yang berubah memang memengaruhi image.
    paths:
      - 'src/**'
      - 'static/**'
      - 'drizzle/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'drizzle.config.ts'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build dan boot image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kras-course:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate utama: image harus benar-benar hidup, bukan sekadar berhasil di-build.
      # Boot menjalankan migrasi, jadi database kosong pun harus siap melayani.
      - name: Boot image dan tunggu siap
        run: |
          set -euo pipefail
          mkdir -p /tmp/kras-data

          docker run -d --name kras \
            -p 3901:3000 \
            -e HOST=0.0.0.0 \
            -e ADMIN_TOKEN=ci-smoke \
            -e DB_PATH=/app/data/krascourse.db \
            -e ORIGIN=http://127.0.0.1:3901 \
            -v /tmp/kras-data:/app/data \
            kras-course:ci

          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3901/ >/dev/null; then
              echo "server siap"
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=kras)" ]; then
              echo "container berhenti saat boot"
              docker logs kras
              exit 1
            fi
            sleep 1
          done

          echo "server tidak siap dalam 60 detik"
          docker logs kras
          exit 1

      - name: Verifikasi gerbang admin dan halaman publik
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:3901

          # halaman publik melayani 200
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/")" = "200" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/courses")" = "200" ]

          # /admin tanpa cookie dialihkan ke halaman login, bukan 500
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/admin")" = "303" ]

          # API admin menolak tanpa token dengan bentuk {code,message}
          RESP=$(curl -s "$BASE/api/admin/courses/tidak-ada/status")
          echo "$RESP" | grep -q '"code":"unauthorized"'
          echo "gate image OK"

      # Push hanya dari main, dan hanya bila image terbukti boot.
      - name: Login ke GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker tag kras-course:ci "$IMAGE:latest"
          docker tag kras-course:ci "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Log container saat gagal
        if: failure()
        run: docker logs kras 2>/dev/null || true

      - name: Bersihkan
        if: always()
        run: docker rm -f kras 2>/dev/null || true